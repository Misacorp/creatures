packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain hardening
minimumReleaseAge: 10080 # minutes (7 days): never install a release younger than this
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade # fail if a package's publish provenance/trust level drops
trustPolicyExclude:
  - 'semver@6.3.1' # transitive (@babel/core); 6.x line predates provenance, false-positive downgrade
blockExoticSubdeps: true # transitive deps must come from the registry (no git/tarball URLs)
strictDepBuilds: true # fail the install if an unreviewed dependency has a build script

# Only these dependencies may run install scripts (false = explicitly denied).
allowBuilds:
  esbuild: true
  workerd: true

# Shared exact versions (every entry is >= 7 days old at the time of pinning).
catalog:
  '@cloudflare/vitest-plugin': 1.4.0
  '@discord/embedded-app-sdk': 2.5.0
  '@eslint/js': 10.0.1
  '@preact/preset-vite': 2.10.6
  eslint: 10.12.0
  preact: 11.0.0
  prettier: 3.9.10
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  valibot: 1.5.0
  vite: 8.3.4
  vitest: 5.0.3
  wrangler: 4.149.0
