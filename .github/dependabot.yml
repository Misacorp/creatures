version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Vitest and the Workers test plugin must move together (the plugin pins its vitest range).
      vitest:
        patterns: ['vitest', '@vitest/*', '@cloudflare/vitest-plugin']
      # With pnpm catalogs Dependabot cannot tell dev from runtime packages, so one group for the rest.
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
