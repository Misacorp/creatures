name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The checks run as parallel jobs; the final `ci` job is the one the main ruleset requires, so its
  # name must stay `ci`. Testing plan and speed budgets: docs/design/testing.md.
  #
  # A PR that only changes documentation skips the build and the tests (`changes` decides). Documentation is
  # every Markdown file and everything under docs/, except docs/compendium/, which a test reads. Anything
  # else, a new folder included, runs everything. Formatting and the security job always run.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # The PR's merge commit and its first parent, the base it was merged onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Does the PR change anything besides documentation?
        id: files
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          echo "Changed files:"
          cat changed.txt
          code=false
          if [ ! -s changed.txt ]; then code=true; fi
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in
              docs/compendium/*) code=true ;;
              docs/* | *.md) ;;
              *) code=true ;;
            esac
          done < changed.txt
          echo "code=${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  checks:
    name: checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm decisions check
      - run: pnpm art library --check
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.code == 'true'
        run: pnpm build

  test-worker:
    name: test-worker (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @creatures/worker exec vitest run --shard=${{ matrix.shard }}/2

  test-sim:
    name: test-sim
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @creatures/sim test

  test-rest:
    name: test-rest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @creatures/game --filter @creatures/engine --filter @creatures/lab --filter @creatures/activity test
      - run: pnpm --filter @creatures/worker exec node --test 'scripts/*.test.mjs'
      - run: node --test 'scripts/*.test.mjs'
      # The contract fixtures must be what the server really answers (docs/design/testing.md, layer 3).
      - run: pnpm fixtures:capture --check

  ci:
    name: ci
    if: always()
    needs: [changes, checks, test-worker, test-sim, test-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      # Every job in `needs` must succeed (a job added there later is covered too). `changes` and `checks` always
      # run; another job may be skipped only when `changes` succeeded and found nothing but documentation. A skip
      # for any other reason (a failed `changes`, say) fails.
      - name: All checks passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: ${CHANGES} (code: ${CODE}), checks: ${CHECKS}, all: ${RESULTS}"
          if [ "$CHANGES" != "success" ] || [ "$CHECKS" != "success" ]; then exit 1; fi
          for r in ${RESULTS}; do
            if [ "$r" = "success" ]; then continue; fi
            if [ "$r" = "skipped" ] && [ "$CODE" = "false" ]; then continue; fi
            exit 1
          done

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..HEAD" .

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          online-audits: false
          advanced-security: false
          persona: regular
