name: deploy

# Pushes to main deploy production. Pushes to any other branch in this repo
# deploy staging. Fork pull requests never trigger this workflow (they only
# trigger `pull_request` in ci.yml), so they never see these secrets.
on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions: {}

jobs:
  deploy:
    name: deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://creatures.misacorp.dev' || 'https://creatures-staging.misacorp.dev' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test (production only; PR CI already covers staging)
        if: github.ref_name == 'main'
        run: pnpm test

      - run: pnpm build

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the '$TARGET_ENV' GitHub environment:$missing"
            exit 1
          fi
          secrets_file="$(mktemp -p "$RUNNER_TEMP" secrets.XXXXXX.json)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg cs "$DISCORD_CLIENT_SECRET" --arg bt "$DISCORD_BOT_TOKEN" \
            '{DISCORD_CLIENT_SECRET: $cs, DISCORD_BOT_TOKEN: $bt}' > "$secrets_file"
          pnpm exec wrangler deploy --env "$TARGET_ENV" --var "VERSION:${GIT_SHA}" --secrets-file "$secrets_file"
