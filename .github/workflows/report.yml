name: report

# The daily analytics report (docs/design/analytics.md). Fetches the aggregate report from the ops
# endpoint of production and staging (JSON and Markdown), writes the Markdown to the job summary and
# keeps the files. The endpoint answers with counts only: no player ids, hashes, names or guild ids.
#
# Runs at 06:17 UTC, when the previous game day has been rolled up (rollups run at 13:40 guild-local
# time, so the newest finished day is two UTC dates back). The range is the 7 days ending then.
# On Mondays it also asks for week-over-week changes (weekly=1).
#
# No checkout and no third-party actions: the job only runs `node` (preinstalled on the runner) on a
# script written in this file, so there is no repository code or action it could be tricked into
# running. The token is only in the environment of the one step that needs it, and the job is bound
# to the `reports` GitHub environment, which holds the OPS_TOKEN secret.
#
# If the endpoint answers 404 (OPS_TOKEN not set there yet), the job warns and still succeeds.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment: reports
    steps:
      - name: Fetch the reports
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OPS_TOKEN" ]; then
            echo "::warning::OPS_TOKEN is not set in the 'reports' environment yet; nothing to fetch."
            exit 0
          fi
          mkdir -p report
          FROM="$(date -u -d '8 days ago' +%F)"
          TO="$(date -u -d '2 days ago' +%F)"
          WEEKLY=0
          if [ "$(date -u +%u)" = "1" ]; then WEEKLY=1; fi
          export FROM TO WEEKLY
          node --input-type=module - <<'EOF'
          import { writeFileSync } from 'node:fs';

          const { OPS_TOKEN, FROM, TO, WEEKLY } = process.env;
          const targets = [
            ['production', 'https://creatures.misacorp.dev'],
            ['staging', 'https://creatures-staging.misacorp.dev'],
          ];
          let failed = 0;
          for (const [name, base] of targets) {
            for (const format of ['json', 'md']) {
              const url = `${base}/api/ops/report?from=${FROM}&to=${TO}&format=${format}&weekly=${WEEKLY}`;
              try {
                const res = await fetch(url, {
                  headers: { Authorization: `Bearer ${OPS_TOKEN}` },
                  signal: AbortSignal.timeout(60_000),
                });
                if (res.status === 404) {
                  console.log(`::warning::${name} (${format}): the report endpoint answered 404. Is OPS_TOKEN set in the ${name} environment and deployed?`);
                  continue;
                }
                if (!res.ok) {
                  console.log(`::error::${name} (${format}): HTTP ${res.status}`);
                  failed += 1;
                  continue;
                }
                writeFileSync(`report/${name}.${format}`, await res.text());
              } catch (err) {
                console.log(`::error::${name} (${format}): ${err instanceof Error ? err.name : 'error'}`);
                failed += 1;
              }
            }
          }
          if (failed > 0) process.exit(1);
          EOF

      - name: Write the job summary
        run: |
          set -euo pipefail
          for target in production staging; do
            if [ -f "report/$target.md" ]; then
              { echo "# $target"; echo; cat "report/$target.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
            # The JSON goes in a collapsed block (the summary is capped at 1 MiB per step).
            if [ -f "report/$target.json" ] && [ "$(wc -c < "report/$target.json")" -lt 300000 ]; then
              {
                echo "<details><summary>$target report (JSON)</summary>"
                echo
                echo '```json'
                cat "report/$target.json"
                echo
                echo '```'
                echo "</details>"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Keeping the files as a 90-day artifact needs actions/upload-artifact pinned to a full commit
      # SHA, and no workflow in this repository uses it yet, so there is no SHA to copy. Add:
      #
      # - uses: actions/upload-artifact@<full commit SHA> # <version>
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: analytics-report
      #     path: report/
      #     retention-days: 90
      #     if-no-files-found: ignore
