name: sim

# Balance simulator. A quick, fixed-seed run on PRs that change game rules,
# the combat engine, content or the simulator; a full run on demand.
# Violations of the balance targets are reported, not failed, while tuning
# is in progress; crashes fail the job.
on:
  pull_request:
    paths:
      - 'packages/game/**'
      - 'packages/engine/**'
      - 'packages/sim/**'
      - 'apps/worker/src/economy.ts'
      - 'docs/design/balance-targets.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: sim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the simulator
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pnpm sim
          else
            pnpm sim:quick
          fi
          cat sim-out/report.md >> "$GITHUB_STEP_SUMMARY"
