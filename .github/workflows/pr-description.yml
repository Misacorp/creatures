name: pr-description

# A squash merge uses the PR description as the commit message (CLAUDE.md, Pull requests). Tools add
# footers to descriptions (a cloud session appends "Generated by Claude Code" on every write), so this
# removes them whenever a description is written, and a plain squash merge needs no hand editing.
# Edits made with GITHUB_TOKEN do not start workflows, so its own edit doesn't run it again.
# Fork PRs are skipped: their token is read-only.
on:
  pull_request:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean:
    name: clean
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read # check out the script
      pull-requests: write # edit the description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/pr-description.mjs
          sparse-checkout-cone-mode: false

      - name: Remove footers from the description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/pr-description.mjs
